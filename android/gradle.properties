org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true

# --- LifeStats TWA settings ---------------------------------------------
# Website the app opens. Must serve /.well-known/assetlinks.json listing this
# app's package name and signing-certificate SHA-256 fingerprint.
twaHost=lifestats.fun
twaStartPath=/dashboard
# Must match ANDROID_PACKAGE_NAME on the website. Cannot change after Play Store publish.
twaApplicationId=fun.lifestats.app
# Bump twaVersionCode for every Play Store upload (CI overrides it with -PtwaVersionCode).
twaVersionCode=1
twaVersionName=1.0.0
