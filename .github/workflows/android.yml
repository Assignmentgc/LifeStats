name: Android app

on:
  workflow_dispatch:
  push:
    tags: ["android-v*"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Optional release signing. Add repository secrets:
      # ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/lifestats.jks"
            echo "LIFESTATS_KEYSTORE_PATH=$RUNNER_TEMP/lifestats.jks" >> "$GITHUB_ENV"
          fi

      - name: Build APK and App Bundle
        env:
          LIFESTATS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          LIFESTATS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          LIFESTATS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$LIFESTATS_KEYSTORE_PATH" ]; then
            ./gradlew assembleRelease bundleRelease -PtwaVersionCode=${{ github.run_number }}
          else
            echo "::warning::No signing secrets configured; building a debug APK only."
            ./gradlew assembleDebug -PtwaVersionCode=${{ github.run_number }}
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: lifestats-android-${{ github.run_number }}
          path: |
            android/app/build/outputs/apk/**/*.apk
            android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: error
